<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="Viewport" content="width=device-width, initial-scale=1.0">
     <meta name="description"
       content="My first rafting webpage using just html and css to build and design itw">
     <title>Contact <U></U>s</title>
     <meta name="author" content="Alexander Onwuasor">
     <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

     <!-- Header -->
     <header>
          <img src="images/logo.jpg" alt="White Water Rafting Logo" width="150">

          <nav>
               <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
               </ul>
          </nav>
     </header>

     <main>

          <!-- Company Contact Information -->
          <section class="company-info">
               <h1>White Water Rafting Company</h1>

               <p>123 Main River Street</p>
               <p>Kolob, California</p>
               <p>+1 999 999 9999</p>
               <p>info@whitewater.com</p>
          </section>

          <!-- Contact Section -->
          <section class="contact-container">

               <!-- Map -->
               <div class="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d7929.371008919625!2d3.4358697089917585!3d6.434427114170889!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1780859168466!5m2!1sen!2sng"
                      width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade"></iframe> alt="Company Location
                    Map">
               </div>

               <!-- Contact Form -->
               <div class="contact-form">
                    <form action="#" method="post">

                         <label for="name">Name:</label>
                         <input type="text" id="name" name="name" placeholder="Placeholder"
                           required>

                         <label for="email">Email:</label>
                         <input type="email" id="email" name="email" placeholder="Placeholder"
                           required>

                         <p>Message Purpose</p>

                         <input type="radio" id="general" name="purpose" value="General Inquiry">
                         <label for="general">General Inquiry</label>

                         <input type="radio" id="reservation" name="purpose"
                           value="Reservation Question">
                         <label for="reservation">Reservation Question</label>

                         <input type="radio" id="suggestion" name="purpose"
                           value="Website Suggestion">
                         <label for="suggestion">Website Suggestion</label>

                         <label for="message">Message:</label>
                         <textarea id="message" name="message" placeholder="Type here"></textarea>

                         <input type="checkbox" id="newsletter" name="newsletter">
                         <label for="newsletter">
                              Please subscribe me to the monthly newsletter
                         </label>

                         <button type="submit">Get in Touch!</button>

                    </form>
               </div>

          </section>

          <!-- Employee Profiles -->
          <section class="employees">
               <h2>We Are Here to Serve You</h2>

               <figure>
                    <img src="images/bigman.jpg" alt="River Guide">
                    <figcaption>John Doe - River Guide</figcaption>
               </figure>

               <figure>
                    <img src="images/logo.jpg" alt="Reservation Manager">
                    <figcaption>Jane Smith - Reservation Manager</figcaption>
               </figure>

               <figure>
                    <img src="images/people.webp" alt="Customer Support">
                    <figcaption>Michael Brown - Customer Support</figcaption>
               </figure>
          </section>

     </main>

     <footer>
          <p>&copy; 2026 White Water Rafting</p>
          <nav class="socialmedia">
               <a href="https://facebook.com"><img src="images/facebook.svg" alt="Follow Us On Facebook"></a>
               <a href="https://instagram.com"><img src="images/instagram.svg"
                      alt="Follow Us On Instagram"></a>
               <a href="https://linkedin.com"><img src="images/linkedin.svg" alt="Follow Us On Linkedin"></a>
          </nav>
     </footer>

</body>
</html>
